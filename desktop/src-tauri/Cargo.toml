[package]
name = "knowhow-capture"
version = "0.1.0"
description = "KnowHow's private Windows workflow capture companion"
authors = ["KnowHow"]
license = "UNLICENSED"
repository = "https://github.com/knowhow/knowhow"
edition = "2024"
rust-version = "1.89"

[lib]
name = "knowhow_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
aes-gcm = "=0.10.3"
anyhow = "=1.0.104"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
open = "=5.4.1"
parking_lot = "=0.12.5"
rand = "=0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "modern_sqlite"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.24.1", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
dxgi-capture-rs = "=1.2.2"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
