<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KnowHow Capture</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="panel-shell">
      <header class="app-header">
        <button id="connect-button" class="brand brand-button" type="button" title="Open KnowHow" aria-label="Open KnowHow">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="brand-copy"><strong>KnowHow</strong></span>
        </button>
        <span id="user-name" class="header-user" hidden></span>
      </header>

      <div class="workspace-bar" aria-label="KnowHow connection">
        <span id="connection-dot" class="connection-dot"></span>
        <span class="workspace-copy"><small>Workspace</small><strong id="connection-label">Checking KnowHow…</strong></span>
        <span class="secure-label">Private</span>
      </div>

      <nav class="panel-tabs" aria-label="Extension sections">
        <button class="panel-tab active" data-panel-tab="capture" type="button">Capture</button>
        <button class="panel-tab" data-panel-tab="guides" type="button">Guides</button>
      </nav>

      <section id="capture-panel" class="panel-view capture-view">
        <form id="start-form" class="capture-form card">
          <div class="start-heading"><span class="start-icon" aria-hidden="true">✦</span><span><strong>Record a workflow</strong><small>Turn your clicks into an editable private guide.</small></span></div>
          <label><span>Guide title</span><input id="guide-title" minlength="2" maxlength="200" placeholder="e.g. Invite a new teammate" required /></label>
          <label class="workspace-field"><span>Workspace</span><input id="workspace-id" maxlength="128" placeholder="Open KnowHow to connect" readonly /></label>
          <button id="start-button" class="primary start-button" type="submit" disabled><span class="record-button-dot" aria-hidden="true"></span> Start capture</button>
        </form>

        <section id="step-feed" class="step-feed" aria-label="Captured steps" aria-live="polite" hidden>
          <header class="step-feed-heading"><span><strong>Captured steps</strong><small>Click any action normally—KnowHow handles the rest.</small></span><span id="feed-count">0</span></header>
          <div id="step-feed-scroll" class="step-feed-scroll">
            <p id="step-feed-empty" class="step-feed-empty">Your steps will appear here as you work.</p>
            <ol id="step-list" class="step-list"></ol>
          </div>
        </section>

        <section id="privacy-settings" class="policy-wiring" hidden aria-hidden="true">
          <div id="smart-blur-options">
            <input id="smart-blur-toggle" data-policy="smartBlurEnabled" type="checkbox" disabled />
            <input data-policy="showRecordingIndicator" type="checkbox" disabled />
            <input data-policy="redactEmails" type="checkbox" disabled />
            <input data-policy="redactPhoneNumbers" type="checkbox" disabled />
            <input data-policy="redactFinancialNumbers" type="checkbox" disabled />
            <input data-policy="redactIds" type="checkbox" disabled />
            <input data-policy="redactFormFields" type="checkbox" disabled />
            <input data-policy="redactAllNumbers" type="checkbox" disabled />
            <input data-policy="redactImages" type="checkbox" disabled />
            <input data-policy="redactTableRows" type="checkbox" disabled />
            <input data-policy="redactLongText" type="checkbox" disabled />
            <input data-policy="redactCommonNames" type="checkbox" disabled />
            <input data-policy-color type="color" value="#d97706" disabled />
          </div>
          <button id="exclude-button" type="button" disabled>Exclude site</button>
        </section>

        <p id="error" class="error" role="alert" hidden></p>

        <section id="capture-actions" class="capture-dock" hidden>
          <div class="dock-tools">
            <button id="pause-button" class="dock-action pause-action" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.5"></rect><rect x="14" y="4" width="4" height="16" rx="1.5"></rect></svg><span>Pause</span></button>
            <button id="blur-panel-button" class="dock-action blur-action" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.25 3.75L17 8l-3.75 1.25L12 13l-1.25-3.75L7 8l3.75-1.25L12 3Z"></path><path d="m18.5 13 .75 2.25L21.5 16l-2.25.75L18.5 19l-.75-2.25L15.5 16l2.25-.75L18.5 13Z"></path><path d="m6 14 .9 2.6 2.6.9-2.6.9L6 21l-.9-2.6-2.6-.9 2.6-.9L6 14Z"></path></svg><span>Smart Blur</span></button>
            <button id="discard-button" class="dock-action discard-action" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="m18 7-1 13H7L6 7"></path><path d="M10 11v5M14 11v5"></path></svg><span>Discard</span></button>
          </div>
          <button id="finish-button" class="primary finish-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg><span>Finish capture</span></button>
        </section>

        <section id="review-actions" class="capture-dock review-dock" hidden>
          <button id="open-review-button" class="primary finish-button" type="button">Retry upload</button>
          <button id="review-discard-button" class="secondary" type="button">Discard</button>
        </section>
      </section>

      <section id="guides-panel" class="panel-view guide-library" hidden>
        <header class="guide-library-heading"><span><small>Follow mode</small><strong>Your guides</strong></span><span id="guide-library-count">0</span></header>
        <label class="guide-search-field"><span class="search-icon" aria-hidden="true"></span><input id="guide-search" type="search" placeholder="Search guides and steps" autocomplete="off" /></label>
        <p id="guide-library-empty" class="guide-library-empty">Open KnowHow once to sync the guides you can access.</p>
        <div id="guide-results" class="guide-results"></div>
        <article id="guide-follow" class="guide-follow" hidden>
          <button id="guide-follow-back" class="text-button guide-back" type="button">← All guides</button>
          <header><span id="guide-follow-status"></span><h2 id="guide-follow-title"></h2><p id="guide-follow-summary"></p></header>
          <div class="follow-progress"><span id="guide-follow-progress"></span><i><span id="guide-follow-progress-bar"></span></i></div>
          <ol id="guide-follow-steps" class="guide-follow-steps"></ol>
          <footer class="guide-follow-actions">
            <button id="guide-previous-step" class="secondary" type="button">Previous</button>
            <button id="guide-next-step" class="primary" type="button">Next</button>
            <button id="guide-open-app" class="text-button" type="button">Open in KnowHow ↗</button>
          </footer>
        </article>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
