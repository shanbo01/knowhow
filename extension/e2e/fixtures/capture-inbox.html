<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capture fixture inbox</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f16;
        color: #e5e7eb;
        font: 14px/1.3 ui-sans-serif, system-ui, sans-serif;
      }
      body { display: flex; flex-direction: column; }
      header {
        position: sticky;
        top: 0;
        flex: none;
        height: 72px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        background: #111827;
        z-index: 5;
      }
      .list { flex: 1; overflow: auto; }
      [role="tablist"] {
        position: sticky;
        top: 0;
        z-index: 4;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 20px;
        background: #0f172a;
      }
      [role="row"] {
        display: grid;
        grid-template-columns: 32px 220px 1fr;
        gap: 16px;
        align-items: center;
        height: 48px;
        padding: 0 20px;
        border-bottom: 1px solid #1f2937;
      }
      [role="row"] input { width: 16px; height: 16px; margin: 0; }
      .sender, .subject { white-space: nowrap; overflow: hidden; }
    </style>
  </head>
  <body>
    <header>Search mail</header>
    <div class="list" id="inbox-list">
      <div role="tablist">
        <span>Primary</span>
        <span>Promotions</span>
        <span>Social</span>
      </div>
    </div>
    <script>
      const list = document.querySelector("#inbox-list");
      const senders = [
        "Ada Lovelace",
        "Grace Hopper",
        "Alan Turing",
        "Katherine Johnson",
        "NaukriGulf Jobs",
        "Guardian Foundry",
      ];
      for (let index = 0; index < 28; index += 1) {
        const row = document.createElement("div");
        row.setAttribute("role", "row");
        row.innerHTML =
          '<input type="checkbox" aria-label="Select row">' +
          `<span class="sender">${senders[index % senders.length]} ${index + 1}</span>` +
          `<span class="subject">Quarterly report for inbox row ${index + 1}</span>`;
        list.append(row);
      }
    </script>
  </body>
</html>
