<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capture fixture light</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 40px; background: #f8fafc; color: #111827; }
      main { width: min(760px, 100%); display: grid; gap: 20px; }
      button, .target { padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
      #menu { width: 240px; padding: 8px; border-radius: 10px; background: white; box-shadow: 0 18px 40px rgb(15 23 42 / 0.18); }
      #menu button { width: 100%; }
      .targets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
  </head>
  <body>
    <main>
      <p id="email">Contact alex@example.test for help.</p>
      <label>Password <input id="secret" type="password" value="hidden-secret" /></label>
      <a id="support" href="/w/helpdesk-ac3fe">Support</a>
      <div>
        <button id="dropdown" type="button" aria-expanded="false">Choose status</button>
        <div id="menu" hidden><button id="option" type="button">Approved</button></div>
      </div>
      <button id="following" type="button">Continue</button>
      <button id="icon-only" type="button"></button>
      <label>Status
        <select id="status-select">
          <option>Pending</option>
          <option>Approved</option>
        </select>
      </label>
      <button id="delayed-nav" type="button">Open later</button>
      <div class="targets">
        <button id="manual-one" class="target" type="button">Manual region one</button>
        <button id="manual-two" class="target" type="button">Manual region two</button>
      </div>
      <div id="shadow-host"></div>
      <output id="result">No selection</output>
    </main>
    <script>
      window.fixtureActions = { manualOne: 0, manualTwo: 0, shadow: 0 };
      const menu = document.querySelector("#menu");
      const dropdown = document.querySelector("#dropdown");
      dropdown.addEventListener("click", () => {
        menu.hidden = !menu.hidden;
        dropdown.setAttribute("aria-expanded", String(!menu.hidden));
      });
      document.querySelector("#option").addEventListener("click", () => {
        document.querySelector("#result").textContent = "Approved";
        menu.hidden = true;
        dropdown.setAttribute("aria-expanded", "false");
      });
      const support = document.querySelector("#support");
      support.addEventListener("mouseenter", () => support.classList.add("hovered"));
      support.addEventListener("click", (event) => {
        event.preventDefault();
        history.pushState({}, "", "/w/helpdesk-ac3fe");
        document.querySelector("#result").textContent = "Support";
      });
      document.querySelector("#delayed-nav").addEventListener("click", () => {
        setTimeout(() => {
          history.pushState({}, "", "/w/helpdesk-ac3fe");
          document.querySelector("#result").textContent = "Later";
        }, 2100);
      });
      document.querySelector("#manual-one").addEventListener("click", () => { window.fixtureActions.manualOne += 1; });
      document.querySelector("#manual-two").addEventListener("click", () => { window.fixtureActions.manualTwo += 1; });
      const shadow = document.querySelector("#shadow-host").attachShadow({ mode: "open" });
      shadow.innerHTML = '<button type="button" style="padding:12px 16px;border:1px solid #cbd5e1;border-radius:8px;background:white">Open shadow control</button>';
      shadow.querySelector("button").addEventListener("click", () => { window.fixtureActions.shadow += 1; });
    </script>
  </body>
</html>
